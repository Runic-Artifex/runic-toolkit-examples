name: Set up .NET workspace
description: Install the pinned SDK and restore the repository-local NuGet cache.

runs:
  using: composite
  steps:
    - uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json
    - uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/.packages/nuget
        key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('global.json', 'Directory.Packages.props', 'release-authority/runic.compatibility-set.json', '**/*.csproj') }}
        restore-keys: |
          nuget-${{ runner.os }}-${{ runner.arch }}-
