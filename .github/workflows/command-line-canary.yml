name: Command Line canary

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: command-line-canary-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  RUNIC_COMPATIBILITY_SET: ${{ github.workspace }}/release-authority/runic.compatibility-set.json
  NUGET_CONFIG_FILE: ${{ github.workspace }}/eng/NuGet.ci.config
  NuGetPackageSourceCredentials_github: Username=${{ github.actor }};Password=${{ secrets.GITHUB_TOKEN }};ValidAuthenticationTypes=Basic

jobs:
  verify:
    name: Consume exact registry candidates
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check out release authority
        uses: actions/checkout@v7
        with:
          repository: Runic-Artifex/.github
          ref: main
          path: release-authority
          persist-credentials: false

      - uses: ./.github/actions/setup-dotnet

      - name: Select exact registry candidates
        run: node eng/export-ci-candidates.mjs >> "$GITHUB_ENV"

      - name: Restore package-only canary
        run: >-
          dotnet restore integrations/Runic.CommandLine.Canary/Runic.CommandLine.Canary.csproj
          --configfile "$NUGET_CONFIG_FILE"

      - name: Build package-only canary
        run: dotnet build integrations/Runic.CommandLine.Canary/Runic.CommandLine.Canary.csproj --no-restore --configuration Release

      - name: Run package-only canary
        run: dotnet run --project integrations/Runic.CommandLine.Canary/Runic.CommandLine.Canary.csproj --no-build --configuration Release

      - name: Publish NativeAOT canary
        run: >-
          dotnet publish integrations/Runic.CommandLine.Canary/Runic.CommandLine.Canary.csproj
          --configuration Release
          --runtime linux-x64
          --self-contained true
          --output "$RUNNER_TEMP/native"
          -p:PublishAot=true
          -p:PublishTrimmed=true
          -p:TrimMode=full
          -p:IlcTreatWarningsAsErrors=true

      - name: Run NativeAOT canary
        run: '"$RUNNER_TEMP/native/Runic.CommandLine.Canary"'

      - name: Ensure portable inputs are unchanged
        run: git diff --exit-code
