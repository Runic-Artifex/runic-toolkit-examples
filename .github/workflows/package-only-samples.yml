name: Package-only samples

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: package-only-samples-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  NuGetPackageSourceCredentials_github: Username=${{ github.actor }};Password=${{ secrets.GITHUB_TOKEN }};ValidAuthenticationTypes=Basic

jobs:
  verify:
    name: Restore and verify every sample
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@runic-artifex"

      - name: Restore published NuGet packages
        shell: bash
        run: |
          while IFS= read -r project; do
            dotnet restore "$project"
          done < <(find samples tests -name '*.csproj' -type f | sort)

      - name: Restore published npm packages
        run: npm ci

      - name: Verify frontend package consumers
        run: npm run verify

      - name: Verify production frontend output
        run: npm run verify:frontend-production

      - name: Build every .NET sample
        shell: bash
        run: |
          while IFS= read -r project; do
            dotnet build "$project" \
              --no-restore \
              --configuration Release \
              -p:RunicToolkitFrontendInstall=false
          done < <(find samples tests -name '*.csproj' -type f | sort)

      - name: Run compiled Markup component checks
        run: >-
          dotnet run
          --project tests/RunicToolkit.Samples.Cwhtml.Components.Tests/RunicToolkit.Samples.Cwhtml.Components.Tests.csproj
          --no-build
          --configuration Release

      - name: Run headless sample checks
        shell: bash
        run: |
          dotnet run --project samples/01-HelloLifecycle/HelloLifecycle.csproj --no-build --configuration Release
          dotnet run --project samples/02-GreetingCommandLine/GreetingCommandLine.csproj --no-build --configuration Release -- greet Runic
          dotnet run --project samples/03-MvvmCounterProjection/MvvmCounterProjection.csproj --no-build --configuration Release
          dotnet run --project samples/04-NativeMvvmCounter/NativeMvvmCounter.csproj --no-build --configuration Release -- --smoke-test

      - name: Ensure package-only inputs are unchanged
        run: git diff --exit-code

  native-aot:
    name: NativeAOT package consumer
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@runic-artifex"

      - name: Restore browser packages
        run: npm ci

      - name: Publish NativeAOT counter
        run: >-
          dotnet publish samples/04-NativeMvvmCounter/NativeMvvmCounter.csproj
          --configuration Release
          --runtime linux-x64
          --self-contained true
          --output "${{ runner.temp }}/native-counter"
          -p:PublishAot=true
          -p:PublishTrimmed=true
          -p:TrimMode=full
          -p:IlcTreatWarningsAsErrors=true

      - name: Run NativeAOT smoke test
        run: "${{ runner.temp }}/native-counter/RunicToolkit.Samples.NativeMvvmCounter --smoke-test"
