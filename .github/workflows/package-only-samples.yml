name: Package-only samples

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: package-only-samples-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  RUNIC_RELEASE_MANIFEST: ${{ github.workspace }}/release-authority/runic.release.json
  RUNIC_COMPATIBILITY_SET: ${{ github.workspace }}/release-authority/runic.compatibility-set.json
  NUGET_CONFIG_FILE: ${{ github.workspace }}/eng/NuGet.ci.config
  NuGetPackageSourceCredentials_github: Username=${{ github.actor }};Password=${{ secrets.GITHUB_TOKEN }};ValidAuthenticationTypes=Basic

jobs:
  verify:
    name: Restore and verify every sample
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check out release authority
        uses: actions/checkout@v7
        with:
          repository: Runic-Artifex/.github
          ref: main
          path: release-authority

      - uses: ./.github/actions/setup-dotnet
      - uses: ./.github/actions/setup-bun

      - name: Select exact registry candidates
        run: node eng/export-ci-candidates.mjs >> "$GITHUB_ENV"

      - name: Download exact npm candidates
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          RUNIC_CANDIDATE_NPM_FEED: ${{ runner.temp }}/runic-candidate-npm-feed
        run: node eng/download-github-npm.mjs "$RUNIC_CANDIDATE_NPM_FEED"

      - name: Prepare exact npm and tool inputs
        env:
          RUNIC_CANDIDATE_NPM_FEED: ${{ runner.temp }}/runic-candidate-npm-feed
        run: node eng/prepare-ci-npm-consumer.mjs

      - name: Restore exact candidate NuGet packages
        shell: bash
        run: |
          while IFS= read -r project; do
            dotnet restore "$project" --configfile "$NUGET_CONFIG_FILE"
          done < <(find samples -name '*.csproj' -type f | sort)

      - name: Restore pinned Runic Translations tool
        run: >-
          dotnet tool restore --tool-manifest samples/05-RunicTranslationsSetup/.config/dotnet-tools.json
          --configfile "$NUGET_CONFIG_FILE"

      - name: Restore frontend dependencies with Bun
        run: bun install --no-save

      - name: Generate cross-runtime translation artifacts
        run: >-
          dotnet build samples/05-RunicTranslationsSetup/RunicTranslationsSetup.csproj
          --no-restore
          --configuration Release

      - name: Generate editor and CLI output contract
        working-directory: samples/05-RunicTranslationsSetup
        run: >-
          dotnet tool run runic-translations generate
          --project translations
          --output obj/cli-verification
          --emit-esm

      - name: Verify editor and CLI output contract
        working-directory: samples/05-RunicTranslationsSetup
        run: >-
          dotnet tool run runic-translations verify
          --project translations
          --output obj/cli-verification
          --emit-esm

      - name: Verify frontend package consumers
        run: bun run verify

      - name: Upload translation bundle measurements
        uses: actions/upload-artifact@v7
        with:
          name: runic-translations-bundle-metrics
          path: samples/05-RunicTranslationsSetup/Frontend/artifacts/bundle-metrics.json
          if-no-files-found: error

      - name: Build every .NET sample
        shell: bash
        run: |
          while IFS= read -r project; do
            dotnet build "$project" \
              --no-restore \
              --configuration Release \
              -p:RunicToolkitFrontendBuildCommand=
          done < <(find samples -name '*.csproj' -type f | sort)

      - name: Run headless sample checks
        shell: bash
        run: |
          dotnet run --project samples/01-HelloLifecycle/HelloLifecycle.csproj --no-build --configuration Release
          dotnet run --project samples/02-GreetingCommandLine/GreetingCommandLine.csproj --no-build --configuration Release -- greet Runic
          dotnet run --project samples/03-SetupApplication/SetupApplication.csproj --no-build --configuration Release -- --smoke-test
          dotnet run --project samples/04-SvelteKitSetupApplication/SvelteKitSetupApplication.csproj --no-build --configuration Release -- --smoke-test
          dotnet run --project samples/05-RunicTranslationsSetup/RunicTranslationsSetup.csproj --no-build --configuration Release -- --smoke-test

      - name: Restore tracked package inputs
        run: node eng/restore-ci-npm-inputs.mjs

      - name: Ensure package-only inputs are unchanged
        run: git diff --exit-code

  native-aot:
    name: NativeAOT package consumer
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check out release authority
        uses: actions/checkout@v7
        with:
          repository: Runic-Artifex/.github
          ref: main
          path: release-authority

      - uses: ./.github/actions/setup-dotnet
      - uses: ./.github/actions/setup-bun

      - name: Select exact registry candidates
        run: node eng/export-ci-candidates.mjs >> "$GITHUB_ENV"

      - name: Download exact npm candidates
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          RUNIC_CANDIDATE_NPM_FEED: ${{ runner.temp }}/runic-candidate-npm-feed
        run: node eng/download-github-npm.mjs "$RUNIC_CANDIDATE_NPM_FEED"

      - name: Prepare exact npm and tool inputs
        env:
          RUNIC_CANDIDATE_NPM_FEED: ${{ runner.temp }}/runic-candidate-npm-feed
        run: node eng/prepare-ci-npm-consumer.mjs

      - name: Restore exact candidate NuGet packages
        shell: bash
        run: |
          dotnet restore samples/03-SetupApplication/SetupApplication.csproj --configfile "$NUGET_CONFIG_FILE"
          dotnet restore samples/04-SvelteKitSetupApplication/SvelteKitSetupApplication.csproj --configfile "$NUGET_CONFIG_FILE"
          dotnet restore samples/05-RunicTranslationsSetup/RunicTranslationsSetup.csproj --configfile "$NUGET_CONFIG_FILE"

      - name: Restore frontend dependencies with Bun
        run: bun install --no-save

      - name: Generate translation frontend artifacts
        shell: bash
        run: |
          dotnet tool restore --tool-manifest samples/05-RunicTranslationsSetup/.config/dotnet-tools.json --configfile "$NUGET_CONFIG_FILE"
          dotnet build samples/05-RunicTranslationsSetup/RunicTranslationsSetup.csproj --no-restore --configuration Release

      - name: Verify and build frontend
        run: bun run verify

      - name: Publish NativeAOT Setup application
        run: >-
          dotnet publish samples/03-SetupApplication/SetupApplication.csproj
          --configuration Release
          --runtime linux-x64
          --self-contained true
          --output "${{ runner.temp }}/native-setup"
          -p:PublishAot=true
          -p:PublishTrimmed=true
          -p:TrimMode=full
          -p:IlcTreatWarningsAsErrors=true
          -p:RunicToolkitFrontendBuildCommand=

      - name: Run NativeAOT smoke test
        run: "${{ runner.temp }}/native-setup/SetupApplication --smoke-test"

      - name: Publish NativeAOT SvelteKit Setup application
        run: >-
          dotnet publish samples/04-SvelteKitSetupApplication/SvelteKitSetupApplication.csproj
          --configuration Release
          --runtime linux-x64
          --self-contained true
          --output "${{ runner.temp }}/native-sveltekit-setup"
          -p:PublishAot=true
          -p:PublishTrimmed=true
          -p:TrimMode=full
          -p:IlcTreatWarningsAsErrors=true
          -p:RunicToolkitFrontendBuildCommand=

      - name: Run NativeAOT SvelteKit smoke test
        run: "${{ runner.temp }}/native-sveltekit-setup/SvelteKitSetupApplication --smoke-test"

      - name: Restore tracked package inputs
        run: node eng/restore-ci-npm-inputs.mjs

  windows-native:
    name: Setup · Windows native host
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check out release authority
        uses: actions/checkout@v7
        with:
          repository: Runic-Artifex/.github
          ref: main
          path: release-authority

      - uses: ./.github/actions/setup-dotnet
      - uses: ./.github/actions/setup-bun

      - name: Select exact registry candidates
        shell: pwsh
        run: node eng/export-ci-candidates.mjs >> $env:GITHUB_ENV

      - name: Download exact npm candidates
        shell: pwsh
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          RUNIC_CANDIDATE_NPM_FEED: ${{ runner.temp }}/runic-candidate-npm-feed
        run: node eng/download-github-npm.mjs "$env:RUNIC_CANDIDATE_NPM_FEED"

      - name: Prepare exact npm and tool inputs
        shell: pwsh
        env:
          RUNIC_CANDIDATE_NPM_FEED: ${{ runner.temp }}/runic-candidate-npm-feed
        run: node eng/prepare-ci-npm-consumer.mjs

      - name: Restore exact candidate NuGet packages
        shell: pwsh
        run: |
          dotnet restore samples/03-SetupApplication/SetupApplication.csproj --configfile "$env:NUGET_CONFIG_FILE"
          dotnet restore samples/04-SvelteKitSetupApplication/SvelteKitSetupApplication.csproj --configfile "$env:NUGET_CONFIG_FILE"
          dotnet restore samples/05-RunicTranslationsSetup/RunicTranslationsSetup.csproj --configfile "$env:NUGET_CONFIG_FILE"

      - name: Restore frontend dependencies with Bun
        run: bun install --no-save

      - name: Generate translation frontend artifacts
        shell: pwsh
        run: |
          dotnet tool restore --tool-manifest samples/05-RunicTranslationsSetup/.config/dotnet-tools.json --configfile "$env:NUGET_CONFIG_FILE"
          dotnet build samples/05-RunicTranslationsSetup/RunicTranslationsSetup.csproj --no-restore --configuration Release

      - name: Verify and build frontend
        run: bun run verify

      - name: Build package-only Setup host
        shell: pwsh
        run: |
          dotnet build samples/03-SetupApplication/SetupApplication.csproj --no-restore --configuration Release -p:RunicToolkitFrontendBuildCommand=
          dotnet build samples/04-SvelteKitSetupApplication/SvelteKitSetupApplication.csproj --no-restore --configuration Release -p:RunicToolkitFrontendBuildCommand=

      - name: Run real embedded and native Setup roundtrip
        shell: pwsh
        run: |
          dotnet run --project samples/03-SetupApplication/SetupApplication.csproj --no-build --configuration Release -- --native-e2e
          dotnet run --project samples/04-SvelteKitSetupApplication/SvelteKitSetupApplication.csproj --no-build --configuration Release -- --native-e2e

      - name: Restore tracked package inputs
        run: node eng/restore-ci-npm-inputs.mjs
