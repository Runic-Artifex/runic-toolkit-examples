name: Package-only samples

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: package-only-samples-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  NuGetPackageSourceCredentials_github: Username=${{ github.actor }};Password=${{ secrets.GITHUB_TOKEN }};ValidAuthenticationTypes=Basic

jobs:
  verify:
    name: Restore and verify every sample
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@runic-artifex"

      - name: Restore published NuGet packages
        shell: bash
        run: |
          while IFS= read -r project; do
            dotnet restore "$project"
          done < <(find samples -name '*.csproj' -type f | sort)

      - name: Restore pinned Runic Translations tool
        run: dotnet tool restore --tool-manifest samples/05-RunicTranslationsSetup/.config/dotnet-tools.json

      - name: Restore published npm packages
        run: npm ci

      - name: Generate cross-runtime translation artifacts
        run: >-
          dotnet build samples/05-RunicTranslationsSetup/RunicTranslationsSetup.csproj
          --no-restore
          --configuration Release

      - name: Verify editor and CLI output contract
        working-directory: samples/05-RunicTranslationsSetup
        run: >-
          dotnet tool run runic-translations verify
          --catalog Resources/setup.catalog.json
          --documents Resources/setup.en.json Resources/setup.de.json
          --output obj/net10.0/translations
          --emit-esm

      - name: Verify frontend package consumers
        run: npm run verify

      - name: Upload translation bundle measurements
        uses: actions/upload-artifact@v7
        with:
          name: runic-translations-bundle-metrics
          path: samples/05-RunicTranslationsSetup/Frontend/artifacts/bundle-metrics.json
          if-no-files-found: error

      - name: Build every .NET sample
        shell: bash
        run: |
          while IFS= read -r project; do
            dotnet build "$project" \
              --no-restore \
              --configuration Release \
              -p:RunicToolkitFrontendBuildCommand=
          done < <(find samples -name '*.csproj' -type f | sort)

      - name: Run headless sample checks
        shell: bash
        run: |
          dotnet run --project samples/01-HelloLifecycle/HelloLifecycle.csproj --no-build --configuration Release
          dotnet run --project samples/02-GreetingCommandLine/GreetingCommandLine.csproj --no-build --configuration Release -- greet Runic
          dotnet run --project samples/03-SetupApplication/SetupApplication.csproj --no-build --configuration Release -- --smoke-test
          dotnet run --project samples/04-SvelteKitSetupApplication/SvelteKitSetupApplication.csproj --no-build --configuration Release -- --smoke-test
          dotnet run --project samples/05-RunicTranslationsSetup/RunicTranslationsSetup.csproj --no-build --configuration Release -- --smoke-test

      - name: Ensure package-only inputs are unchanged
        run: git diff --exit-code

  native-aot:
    name: NativeAOT package consumer
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@runic-artifex"

      - name: Restore browser packages
        run: npm ci

      - name: Verify and build frontend
        run: npm run verify

      - name: Publish NativeAOT Setup application
        run: >-
          dotnet publish samples/03-SetupApplication/SetupApplication.csproj
          --configuration Release
          --runtime linux-x64
          --self-contained true
          --output "${{ runner.temp }}/native-setup"
          -p:PublishAot=true
          -p:PublishTrimmed=true
          -p:TrimMode=full
          -p:IlcTreatWarningsAsErrors=true
          -p:RunicToolkitFrontendBuildCommand=

      - name: Run NativeAOT smoke test
        run: "${{ runner.temp }}/native-setup/SetupApplication --smoke-test"

      - name: Publish NativeAOT SvelteKit Setup application
        run: >-
          dotnet publish samples/04-SvelteKitSetupApplication/SvelteKitSetupApplication.csproj
          --configuration Release
          --runtime linux-x64
          --self-contained true
          --output "${{ runner.temp }}/native-sveltekit-setup"
          -p:PublishAot=true
          -p:PublishTrimmed=true
          -p:TrimMode=full
          -p:IlcTreatWarningsAsErrors=true
          -p:RunicToolkitFrontendBuildCommand=

      - name: Run NativeAOT SvelteKit smoke test
        run: "${{ runner.temp }}/native-sveltekit-setup/SvelteKitSetupApplication --smoke-test"

  windows-native:
    name: Setup · Windows native host
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@runic-artifex"

      - name: Restore package-only frontend
        run: npm ci

      - name: Verify and build frontend
        run: npm run verify

      - name: Build package-only Setup host
        shell: pwsh
        run: |
          dotnet restore samples/03-SetupApplication/SetupApplication.csproj
          dotnet build samples/03-SetupApplication/SetupApplication.csproj --no-restore --configuration Release -p:RunicToolkitFrontendBuildCommand=
          dotnet restore samples/04-SvelteKitSetupApplication/SvelteKitSetupApplication.csproj
          dotnet build samples/04-SvelteKitSetupApplication/SvelteKitSetupApplication.csproj --no-restore --configuration Release -p:RunicToolkitFrontendBuildCommand=

      - name: Run real browser and native Setup roundtrip
        shell: pwsh
        run: |
          $browser = 'C:\Program Files\Google\Chrome\Application\chrome.exe'
          if (-not (Test-Path $browser)) {
            $browser = 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe'
          }
          if (-not (Test-Path $browser)) { throw 'No supported browser executable was found.' }
          $env:WEBUI_BROWSER_PATH = $browser
          dotnet run --project samples/03-SetupApplication/SetupApplication.csproj --no-build --configuration Release -- --native-e2e
          dotnet run --project samples/04-SvelteKitSetupApplication/SvelteKitSetupApplication.csproj --no-build --configuration Release -- --native-e2e
