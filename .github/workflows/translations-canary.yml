name: Runic Translations canary

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: translations-canary-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NuGetPackageSourceCredentials_github: Username=${{ github.actor }};Password=${{ secrets.GITHUB_TOKEN }};ValidAuthenticationTypes=Basic

jobs:
  verify:
    name: Consume published packages
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore package-only canary
        run: dotnet restore integrations/RunicTranslations.Canary/RunicTranslations.Canary.csproj

      - name: Build package-only canary
        run: dotnet build integrations/RunicTranslations.Canary/RunicTranslations.Canary.csproj --no-restore --configuration Release

      - name: Run package-only canary
        run: dotnet run --project integrations/RunicTranslations.Canary/RunicTranslations.Canary.csproj --no-build --configuration Release
