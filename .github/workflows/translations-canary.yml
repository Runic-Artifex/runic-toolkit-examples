name: Runic Translations canary

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: translations-canary-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  verify:
    name: Consume local candidate packages
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build isolated package candidates
        shell: bash
        env:
          RUNIC_CANDIDATE_SET: translations
        run: bash eng/prepare-ci-candidates.sh

      - name: Restore package-only canary
        run: >-
          dotnet restore integrations/Runic.Translations.Canary/Runic.Translations.Canary.csproj
          --configfile "$RUNIC_CANDIDATE_NUGET_CONFIG"

      - name: Build package-only canary
        run: dotnet build integrations/Runic.Translations.Canary/Runic.Translations.Canary.csproj --no-restore --configuration Release

      - name: Run package-only canary
        run: dotnet run --project integrations/Runic.Translations.Canary/Runic.Translations.Canary.csproj --no-build --configuration Release
