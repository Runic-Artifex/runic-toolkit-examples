name: Runic Translations canary

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: translations-canary-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_CONFIG_FILE: ${{ github.workspace }}/eng/NuGet.ci.config
  NuGetPackageSourceCredentials_github: Username=${{ github.actor }};Password=${{ secrets.GITHUB_TOKEN }};ValidAuthenticationTypes=Basic

jobs:
  verify:
    name: Consume exact registry candidates
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-dotnet

      - name: Select exact registry candidates
        run: node eng/export-ci-candidates.mjs >> "$GITHUB_ENV"

      - name: Restore package-only canary
        run: >-
          dotnet restore integrations/Runic.Translations.Canary/Runic.Translations.Canary.csproj
          --configfile "$NUGET_CONFIG_FILE"

      - name: Build package-only canary
        run: dotnet build integrations/Runic.Translations.Canary/Runic.Translations.Canary.csproj --no-restore --configuration Release

      - name: Run package-only canary
        run: dotnet run --project integrations/Runic.Translations.Canary/Runic.Translations.Canary.csproj --no-build --configuration Release
