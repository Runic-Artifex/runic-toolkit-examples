<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <base href="../">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ToDo · Angular</title>
  <script src="webui.js"></script>
</head>
<body data-framework="Angular">
  <script>
    document.body.dataset.demo =
      location.pathname.includes("/advanced/") ? "advanced" : "simple";
    document.title =
      (document.body.dataset.demo === "advanced" ? "Advanced ToDo" : "Simple ToDo") +
      " · Angular";
  </script>
  <todo-app id="app" aria-live="polite">
    <div class="app-shell"><div class="alert alert-secondary">Connecting to the native C# ViewModel…</div></div>
  </todo-app>
</body>
</html>
