<div class="app-shell simple-shell">
  <todo-app-header
    title="Simple ToDo"
    subtitle="One shared C# ViewModel surfaced through Angular signals."
  />
  <section class="card hero-card">
    <div class="card-body p-4">
      <form class="input-group mb-4" (submit)="add($event)">
        <label class="visually-hidden" for="new-title">New task</label>
        <input
          id="new-title"
          class="form-control"
          [value]="title()"
          maxlength="80"
          placeholder="What needs doing?"
          (input)="setTitle($event)"
        >
        <button class="btn btn-primary" [disabled]="!canAdd()">
          <i class="fa-solid fa-plus me-2" aria-hidden="true"></i>Add
        </button>
      </form>
      <div class="d-flex justify-content-between text-secondary small mb-3">
        <span>{{ items().length - completed() }} remaining</span>
        <span>{{ completed() }} completed</span>
      </div>
      <ul class="list-group list-group-flush">
        @for (item of items(); track item.id) {
          <li
            class="list-group-item px-0 todo-row"
            [class.completed]="item.isCompleted"
          >
            <button
              class="btn btn-sm btn-outline-primary rounded-circle"
              [attr.aria-label]="item.isCompleted ? 'Mark active' : 'Mark complete'"
              (click)="todo.toggle.execute(item.id).completion"
            >
              <i
                [class]="item.isCompleted ? 'fa-solid fa-check' : 'fa-regular fa-circle'"
                aria-hidden="true"
              ></i>
            </button>
            <span class="todo-title">{{ item.title }}</span>
            <button
              class="btn btn-sm btn-outline-danger todo-actions"
              [attr.aria-label]="'Remove ' + item.title"
              (click)="todo.remove.execute(item.id).completion"
            >
              <i class="fa-solid fa-trash" aria-hidden="true"></i>
            </button>
          </li>
        }
      </ul>
    </div>
  </section>
</div>
