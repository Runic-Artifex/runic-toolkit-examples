<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Native MVVM Counter · WebUIToolkit</title>
  <link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="vendor/fontawesome/css/fontawesome.min.css">
  <link rel="stylesheet" href="vendor/fontawesome/css/solid.min.css">
  <link rel="stylesheet" href="site.css">
  <script src="webui.js"></script>
  <script defer src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <main class="container py-5">
    <section class="card border-0 shadow-lg mx-auto">
      <div class="card-body p-5">
        <p class="text-uppercase text-primary fw-bold small mb-2">
          <i class="fa-solid fa-arrows-left-right-to-line" aria-hidden="true"></i>
          One native binary binding
        </p>
        <h1 class="display-5 fw-semibold">Framework-neutral MVVM</h1>
        <p class="text-body-secondary">
          This browser talks to a CommunityToolkit ViewModel through the
          production CsWebUi FrameChannel—without ASP.NET Core.
        </p>

        <div id="status" class="alert alert-secondary" role="status">Connecting…</div>
        <output id="count" class="counter d-block text-center my-4">0</output>

        <div class="d-grid gap-3">
          <button id="increment" class="btn btn-primary btn-lg" type="button" disabled>
            <i class="fa-solid fa-plus" aria-hidden="true"></i> Increment in C#
          </button>
          <div class="input-group">
            <span class="input-group-text">Set value</span>
            <input id="value" class="form-control" type="number" value="0">
            <button id="set" class="btn btn-outline-secondary" type="button" disabled>Apply</button>
          </div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
